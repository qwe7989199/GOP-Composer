[package]
name = "gop-composer"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Local GOP-level replacement and remuxing tool for H.264/HEVC delivery streams"
publish = false

[dependencies]
eframe = "0.31.1"
raw-window-handle = "0.6.2"
rfd = "0.15.4"

[build-dependencies]
cc = "1.2.62"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.23"
